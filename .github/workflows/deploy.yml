name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Same layout as on your computer: site/ and pagepal/ side by side.
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: PagePal/pagepal
          path: pagepal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pagepal
        working-directory: pagepal
        run: npm ci && npm run build
      - name: Build website
        working-directory: site
        run: npm ci && npm run build
        env:
          SITE_URL: https://ishan-18.github.io/pagepal/ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4